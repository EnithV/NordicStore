<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore — Catálogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
  </head>
  <body>
    <header id="header" class="sticky-top"></header>
    <div class="container page-head">
      <h1>Catálogo</h1>
      <p class="text-secondary">Diez productos de demo. Precios en USD.</p>
      <div class="row g-2 mb-3">
        <div class="col-md-6"><input id="q" class="form-control" placeholder="Buscar auriculares, tablet, cámara…"></div>
        <div class="col-md-4">
          <select id="cat" class="form-select">
            <option value="">Todas las categorías</option>
          </select>
        </div>
      </div>
    </div>
    <div class="container pb-5">
      <div class="row g-3" id="grid"></div>
    </div>
    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/home.js"></script>
    <script src="catalogo.js"></script>
  </body>
</html>
