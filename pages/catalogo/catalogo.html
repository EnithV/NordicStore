<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore</title>
    <style>
      html, body { margin: 0; }
      body.has-shop { background: #1a120c; font-family: Figtree, system-ui, sans-serif; }
      .product-body, .product-body h3, .price { color: #1c1410; }
      .desc { color: #4a3d34; }
      .navbar { display: flex; align-items: center; gap: 24px; padding: 0 40px; height: 68px; background: #1a1410; color: #f4efe8; }
      .nav-links { display: flex; gap: 20px; }
      .nav-links a { color: #b8a898; text-decoration: none; }
      .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
      [hidden] { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script src="../../assets/js/boot.js"></script>
    <script src="/NordicStore/assets/js/boot.js"></script>
  </head>
  <body class="has-shop">
    <div id="header"></div>
    <section class="shelf">
      <div class="shelf-inner">
        <h2 class="shelf-title" data-i18n="catalog.featured">Productos destacados</h2>
        <p class="lede" data-i18n="catalog.lede">Tecnología para el norte. Movilidad, audio y cómputo con carácter invernal.</p>
        <div class="shelf-tools">
          <input id="q" data-i18n-placeholder="catalog.search">
          <select id="cat"></select>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </section>
    <div id="footer-placeholder"></div>
    <script>
      nsLoadScripts(["assets/js/i18n.js", "assets/js/config.js", "assets/js/api.js", "assets/js/store.js", "assets/js/home.js", "pages/catalogo/catalogo.js"], function () {
        if (typeof cargarLayout === "function") cargarLayout();
        if (typeof iniciarHome === "function") iniciarHome();
        if (typeof iniciarFiltrosCatalogo === "function") iniciarFiltrosCatalogo();
      });
    </script>
  </body>
</html>
