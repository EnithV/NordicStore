<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore</title>
    <style>
      html, body { margin: 0; font-family: Figtree, system-ui, sans-serif; }
      .navbar { display: flex; align-items: center; gap: 24px; padding: 0 40px; height: 68px; background: #1a1410; color: #f4efe8; }
      .nav-links { display: flex; gap: 20px; }
      .nav-links a { color: #b8a898; text-decoration: none; }
      .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
      [hidden] { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script src="../../assets/js/boot.js"></script>
    <script src="/NordicStore/assets/js/boot.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main class="content">
      <h1 data-i18n="login.title">Iniciar sesión</h1>
      <form class="panel" id="login-form" style="max-width:28rem;">
        <p class="muted" data-i18n="login.hint">Demo: aiko / password · admin lars / password</p>
        <label data-i18n="login.user">Usuario o correo</label>
        <input name="username" required>
        <label data-i18n="login.password">Contraseña</label>
        <input type="password" name="password" required>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit">Entrar</button>
      </form>
    </main>
    <div id="footer-placeholder"></div>
    <script>
      nsLoadScripts(["assets/js/i18n.js", "assets/js/config.js", "assets/js/api.js", "assets/js/store.js"], function () {
        var form = document.getElementById("login-form");
        if (!form) return;
        form.addEventListener("submit", async function (ev) {
          ev.preventDefault();
          var fd = new FormData(form);
          try {
            var data = await apiFetch("/auth/login", {
              method: "POST",
              body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") })
            });
            guardarSesion(data);
            window.location.href = urlApp("/index.html");
          } catch (e) {
            toast(e.message || "Error", "error");
          }
        });
      });
    </script>
  </body>
</html>
