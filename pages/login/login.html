<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore — Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="content page-head">
      <h1>Iniciar sesión</h1>
      <form class="panel mt-3" id="login-form" style="max-width:28rem;">
        <p class="small text-secondary">Demo: <code>aiko</code> / <code>password</code> · admin <code>lars</code> / <code>password</code></p>
        <label class="form-label">Usuario o correo</label>
        <input class="form-control mb-2" name="username" required>
        <label class="form-label">Contraseña</label>
        <input class="form-control mb-3" type="password" name="password" required>
        <button class="btn btn-wood" type="submit">Entrar</button>
        <a class="ms-2" href="../registro/registro.html">Crear cuenta</a>
      </form>
    </div>
    <div id="footer-placeholder"></div>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script>
      document.getElementById("login-form").addEventListener("submit", async function (ev) {
        ev.preventDefault();
        var fd = new FormData(ev.target);
        try {
          var data = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") })
          });
          guardarSesion(data);
          window.location.href = urlApp("/index.html");
        } catch (e) {
          toast(e.message || "No se pudo iniciar sesión. Si el API está dormido, espera un minuto y reintenta.", "error");
        }
      });
    </script>
  </body>
</html>
