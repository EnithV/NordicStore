<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="content page-head">
      <h1>Panel admin</h1>
      <p class="text-secondary">Clientes del API. Entra con <code>lars / password</code>.</p>
      <div class="panel" id="admin-box">Cargando…</div>
    </div>
    <div id="footer-placeholder"></div>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        var box = document.getElementById("admin-box");
        var user = usuarioActual();
        if (!user || String(user.rol).toUpperCase() !== "ADMIN") {
          box.textContent = "Necesitas una sesión ADMIN (lars / password).";
          return;
        }
        try {
          var list = await apiFetch("/customers");
          box.innerHTML = "<table class='table'><thead><tr><th>Id</th><th>Nombre</th><th>Usuario</th><th>Rol</th></tr></thead><tbody>" +
            list.map(function (c) {
              return "<tr><td>" + c.id + "</td><td>" + c.name + "</td><td>" + c.username + "</td><td>" + c.rol + "</td></tr>";
            }).join("") + "</tbody></table>";
        } catch (e) {
          box.textContent = e.message || "No se pudo cargar clientes. ¿El API está en línea?";
        }
      });
    </script>
  </body>
</html>
