<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore</title>
    <style>
      html, body { margin: 0; font-family: Figtree, system-ui, sans-serif; }
      .navbar { display: flex; align-items: center; gap: 24px; padding: 0 40px; height: 68px; background: #1a1410; color: #f4efe8; }
      .nav-links { display: flex; gap: 20px; }
      .nav-links a { color: #b8a898; text-decoration: none; }
      .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
      [hidden] { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script src="../../assets/js/boot.js"></script>
    <script src="/NordicStore/assets/js/boot.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main class="content">
      <p class="muted" data-i18n="profile.eyebrow">Tu cuenta</p>
      <h1 data-i18n="profile.title">Perfil</h1>
      <div class="panel" id="profile-box"></div>
    </main>
    <div id="footer-placeholder"></div>
    <script>
      nsLoadScripts(["assets/js/i18n.js", "assets/js/config.js", "assets/js/api.js", "assets/js/store.js"]);
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          if (typeof exigirSesion === "function" && !exigirSesion()) return;
          var user = usuarioActual();
          document.getElementById("profile-box").innerHTML =
            "<p>" + t("profile.subtitle", { name: user.nombre || user.username }) + "</p>" +
            "<p><strong>" + t("register.username") + ":</strong> " + user.username + "</p>" +
            "<p><strong>" + t("register.email") + ":</strong> " + (user.email || "") + "</p>";
        }, 80);
      });
    </script>
  </body>
</html>
