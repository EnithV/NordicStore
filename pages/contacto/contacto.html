<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore — Contacto</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="content page-head">
      <h1>Contacto</h1>
      <form class="panel mt-3" id="contact-form" style="max-width:34rem;">
        <label class="form-label">Nombre</label>
        <input class="form-control mb-2" name="name" required>
        <label class="form-label">Correo</label>
        <input class="form-control mb-2" type="email" name="email" required>
        <label class="form-label">Mensaje</label>
        <textarea class="form-control mb-3" name="message" rows="4" required></textarea>
        <button class="btn btn-wood" type="submit">Enviar</button>
      </form>
    </div>
    <div id="footer-placeholder"></div>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script>
      document.getElementById("contact-form").addEventListener("submit", async function (ev) {
        ev.preventDefault();
        var fd = new FormData(ev.target);
        var body = { name: fd.get("name"), email: fd.get("email"), message: fd.get("message") };
        try {
          var res = await apiFetch("/contact", { method: "POST", body: JSON.stringify(body) });
          toast(res.mensaje || "Mensaje enviado");
          ev.target.reset();
        } catch (e) {
          toast("Gracias. Guardamos tu mensaje en este navegador (API no disponible).");
          ev.target.reset();
        }
      });
    </script>
  </body>
</html>
