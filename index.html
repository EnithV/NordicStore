<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NordicStore</title>
    <style>
      html, body { margin: 0; }
      body.has-shop { background: #1a120c; font-family: Figtree, system-ui, sans-serif; }
      .product-body, .product-body h3, .price { color: #1c1410; }
      .desc { color: #5c4e42; }
      .navbar { display: flex; align-items: center; gap: 24px; padding: 0 40px; height: 68px; background: #1a1410; color: #f4efe8; }
      .brand { color: #f4efe8; text-decoration: none; font-size: 1.45rem; }
      .nav-links { display: flex; gap: 20px; flex-wrap: wrap; }
      .nav-links a { color: #b8a898; text-decoration: none; font-size: 0.9rem; }
      .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      .hero { background: #16110e; }
      .hero-art { display: block; width: 100%; height: min(46vh, 440px); object-fit: contain; object-position: center; background: #16110e; }
      .shelf { background: linear-gradient(180deg, #241810 0%, #1a120c 100%); padding: 36px 40px 64px; }
      [hidden] { display: none !important; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script src="assets/js/boot.js?v=3"></script>
    <script src="/NordicStore/assets/js/boot.js?v=3"></script>
  </head>
  <body class="has-shop">
    <div id="header"></div>
    <section class="hero">
      <h1 class="sr-only">NordicStore</h1>
      <img class="hero-art" id="hero-art" alt="NordicStore" src="assets/images/nordic-hero.png">
    </section>
    <section class="shelf">
      <div class="shelf-inner">
        <h2 class="shelf-title" data-i18n="catalog.featured">Productos destacados</h2>
        <p class="lede" data-i18n="catalog.lede">Tecnología para el norte. Movilidad, audio y cómputo con carácter invernal.</p>
        <div class="grid" id="featured"><p class="lede">Cargando productos…</p></div>
      </div>
    </section>
    <div id="footer-placeholder"></div>
    <script>
      if (window.nsAsset) {
        var img = document.getElementById("hero-art");
        if (img) img.src = nsAsset("assets/images/nordic-hero.png");
        nsLoadScripts([
          "assets/js/i18n.js",
          "assets/js/config.js",
          "assets/js/api.js",
          "assets/js/store.js",
          "assets/js/home.js"
        ], function () {
          if (typeof cargarLayout === "function") cargarLayout();
          if (typeof iniciarHome === "function") iniciarHome();
        });
      }
    </script>
  </body>
</html>
