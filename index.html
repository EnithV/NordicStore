<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NordicStore — tienda demo de electrónica." />
    <title>NordicStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="has-shop">
    <div id="header"></div>
    <section class="hero">
      <h1 class="sr-only">NordicStore</h1>
      <img class="hero-art" src="assets/images/nordic-hero.png" width="1600" height="900" alt="NordicStore">
    </section>
    <section class="shelf">
      <div class="shelf-inner">
        <h2 class="shelf-title">Productos destacados</h2>
        <p class="lede">Tecnología para el norte. Movilidad, audio y cómputo con carácter invernal.</p>
        <div class="grid" id="featured"></div>
      </div>
    </section>
    <div id="footer-placeholder"></div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
